# cCKF/configs/cckf_envelope.yaml
# cCKF integration config — envelope seeding + learned gate/value
digi: true
reco: true
ckf: true
ambi: true

# Use cCKF algorithm instead of standard CKF
cckf: true
cckf_gate_weights: /data/weights/gate.bin
cckf_value_weights: /data/weights/value.bin
cckf_gate_threshold: 0.5
cckf_value_threshold: 0.1
cckf_gate_max_candidates: 10
cckf_gate_window_nsigma: 10.0
cckf_digi_config: odd-digi-geometric-config.json
digi_config: odd-digi-geometric-config.json
cckf_timing_output: timing.csv

# Envelope seeding (from spec §6.2)
num_seeds_per_spm: 46
seed_minPt: 0.587
seed_impactMax: 2.86
seed_sigmaScattering: 2.95

# CKF params (envelope)
ckf_chi2CutOffMeasurement: 16.26
ckf_chi2CutOffOutlier: 35.75
ckf_numMeasurementsCutOff: 5
ckf_nMeasurementsMin: disabled
ckf_maxHolesAndOutliers: disabled
ckf_ptMin: disabled

# Evaluation
events: 32
skip: 32
threads: 1

# Writers
write_track_states: true
ckf_finding_performance: true
ambi_finding_performance: true
write_track_summary: true
