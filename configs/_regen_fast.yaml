# True fast_t331 stage-1 collection for uncensored winfail regeneration.
# Real branch dynamics (in-flight hole kills, cap 5, native seeding) plus
# the expansion writers. Events [0,8) of the train split; [32,64) sealed.
digi: true
reco: true
ckf: true
ambi: true
ambi_solver: greedy

cckf: false
cckf_gate_weights: ""
cckf_value_weights: ""
cckf_digi_config: odd-digi-geometric-config.json
digi_config: odd-digi-geometric-config.json
cckf_timing_output: timing.csv

num_seeds_per_spm: 25
seed_minPt: 0.6706789
seed_impactMax: 0.5807011
seed_sigmaScattering: 2.1464450

ckf_chi2CutOffMeasurement: 15.4010217
ckf_chi2CutOffOutlier: 31.8732773
ckf_numMeasurementsCutOff: 5

ckf_nMeasurementsMin: 8
ckf_maxHolesAndOutliers: 1
ckf_ptMin: 0.6215760

events: 8
skip: 0
threads: 8

output_digi_csv: true
output_simhits_csv: true
write_predicted_cov: true
write_track_states: true
write_track_summary: true
ckf_finding_performance: true
ambi_finding_performance: true
