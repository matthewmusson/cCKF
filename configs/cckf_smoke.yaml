# cCKF smoke test — ACTS default seeding + learned gate/value
# Uses lighter seeding (5 seeds/SPM vs 46 in envelope) to make the
# smoke test complete in minutes instead of hours.
digi: true
reco: true
ckf: true
ambi: true

# Use cCKF algorithm instead of standard CKF
cckf: true
cckf_gate_weights: /data/weights/gate.bin
cckf_value_weights: /data/weights/value.bin
cckf_gate_threshold: 0.5
cckf_value_threshold: 0.1
cckf_gate_max_candidates: 10
cckf_digi_config: odd-digi-geometric-config.json
cckf_timing_output: timing.csv

# ACTS default seeding (much lighter than envelope)
num_seeds_per_spm: 5
seed_minPt: 0.4
seed_impactMax: 20.0
seed_sigmaScattering: 5.0

# CKF params (ACTS defaults)
ckf_chi2CutOffMeasurement: 15.0
ckf_chi2CutOffOutlier: 25.0
ckf_numMeasurementsCutOff: 2

# Track selection
ckf_nMeasurementsMin: 7
ckf_ptMin: 1.0

# Evaluation — test set
events: 1
skip: 32
threads: 8

# Writers
ckf_finding_performance: true
ambi_finding_performance: true
write_track_summary: true
