# cCKF with tight_t79 seeding — learned gate + value, real weights
# Seeding from joint MOTPE trial 79 (spec §4.2): high efficiency, low fakes
digi: true
reco: true
ckf: true
ambi: true

# Use cCKF algorithm instead of standard CKF
cckf: true
cckf_gate_weights: /data/weights/gate.bin
cckf_value_weights: /data/weights/value.bin
cckf_gate_threshold: 0.5
cckf_value_threshold: 0.2
cckf_gate_max_candidates: 6
cckf_gate_window_nsigma: 10.0
cckf_digi_config: odd-digi-geometric-config.json
digi_config: odd-digi-geometric-config.json
cckf_timing_output: timing.csv

# tight_t79 seeding (MOTPE-optimized)
num_seeds_per_spm: 16
seed_minPt: 0.6876416997703818
seed_impactMax: 2.5032955914538624
seed_sigmaScattering: 2.3396240725684057

# tight_t79 CKF params
ckf_chi2CutOffMeasurement: 16.255929655134203
ckf_chi2CutOffOutlier: 20.657664491030744
ckf_numMeasurementsCutOff: 3

# tight_t79 track selection
ckf_nMeasurementsMin: 5
ckf_maxHolesAndOutliers: 15
ckf_ptMin: 0.4597609399152028

# 1 val event
events: 1
skip: 32
threads: 1

# Writers
ckf_finding_performance: true
ambi_finding_performance: true
write_track_states: true
write_track_summary: true
